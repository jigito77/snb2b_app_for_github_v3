name: snb2b_app
description: B2B-приложение для заказа запчастей грузовой техники и спецтехники.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: "^3.4.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management / navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Network / storage
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Карта выбора точки доставки (OpenStreetMap, как на сайте) и геолокация
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0

  # Вход через Google (idToken проверяет backend)
  google_sign_in: ^6.2.1

  # UI helpers
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.6

  # Push notifications (FCM). Работает только после добавления google-services.json / GoogleService-Info.plist.
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/brand/
    - assets/data/
    - assets/products/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#FFCD26"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFCD26"
  image: assets/icon/splash.png
  android_12:
    color: "#FFCD26"
    image: assets/icon/splash.png

# Не даёт подтянуть jni (сборка C++ падает на Windows)
dependency_overrides:
  path_provider_android: 2.2.15
  path_provider_foundation: 2.4.1
